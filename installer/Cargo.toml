[package]
name = "pa-installer"
version = "0.1.3"
edition = "2021"
description = "Installs the pa-pack personal-assistant skills, agents, hooks and state into a project's .claude folder through a local web UI."
license = "MIT"

[dependencies]
tiny_http = "0.12"
include_dir = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
